name: Coletar dados de mercado

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3): 06:10, 12:40 e 17:40 de segunda a sexta,
    # e 09:40 no sábado (para o fechamento de sexta). O agente do boletim roda por volta das 06:40.
    - cron: "10 9 * * 1-5"
    - cron: "40 15,20 * * 1-5"
    - cron: "40 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar
        run: python coletor/coletar.py

      - name: Salvar no repositório
        run: |
          git config user.name "gustavosarti"
          git config user.email "72812365+gustavosarti@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Dados de mercado $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
